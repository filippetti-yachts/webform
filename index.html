    <style>
        /* Reset e Font */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        /* Container del Form */
        form#__vtigerWebForm_2 {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        /* Logo o Intestazione (opzionale) */
        form::before {
            content: "";
            display: block;
            width: 150px;
            height: 50px;
            margin: 0 auto 30px;
            background: url('https://filippettiyachts.com/wp-content/uploads/2024/04/Logo_FY_w.svg') no-repeat center;
            background-size: contain;
            filter: invert(1); /* Lo rende scuro se il logo originale è bianco */
        }

        /* Tabella layout */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 0; vertical-align: middle; }
        
        /* Etichette */
        label {
            font-weight: 600;
            font-size: 14px;
            color: #4b4f56;
            display: block;
            margin-bottom: 5px;
        }

        /* Campi di Input e Select */
        input[type="text"], 
        input[type="email"], 
        input[type="number"],
        select {
            width: 100% !important;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #003366;
            outline: none;
        }

        /* Checkbox e Privacy */
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Pulsante Invia */
        input[type="submit"] {
            background-color: #003366;
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            transition: background 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="submit"]:hover {
            background-color: #001a33;
        }

        input[type="submit"]:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Correzione Select2 per lo stile moderno */
        .select2-container--default .select2-selection--single {
            height: 45px !important;
            padding-top: 8px;
            border: 1px solid #ddd !important;
        }
        
        [aria-multiselectable="true"] .select2-results__option[aria-selected="true"] {
            display: none !important;
        }
    </style>
</head>

            </tr>
